name = "hosthtml"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (favicon, icons). The worker handles all app routes.
[assets]
directory = "./public"
binding = "ASSETS"

# Build pipeline: typecheck then inline client JS into src/ui.ts.
# NOTE: no watch_dir — scripts/inline.mjs rewrites src/ui.ts, so watching src/
# would trigger an endless rebuild loop under `wrangler dev`. Run `npm run
# inline` manually when iterating, or rely on deploy's one-shot build.
[build]
command = "npm run build"
cwd = "."

# --- D1 Database (metadata) ---
[[d1_databases]]
binding = "DB"
database_name = "hosthtml-db"
database_id = "f3ba95ca-1f66-4a0b-b2c6-6858d92df74a"
migrations_dir = "migrations"

# --- R2 Bucket (HTML file storage) ---
[[r2_buckets]]
binding = "HTML_BUCKET"
bucket_name = "hosthtml"   # run: wrangler r2 bucket create hosthtml

# --- Custom domain ---
# The bare domain is bound as a Custom Domain (auto-manages SSL + DNS).
[[routes]]
pattern = "hosthtml.online"
custom_domain = true

# Wildcard subdomains cannot be Custom Domains — they use a plain Route. This
# requires a wildcard DNS record (CNAME * -> worker) on hosthtml.online.
# Any subdomain then hits the worker, which resolves <sub>.hosthtml.online to
# a user page by its `subdomain` field.
[[routes]]
pattern = "*.hosthtml.online"
custom_domain = false

# --- Secrets (set via `wrangler secret put`) ---
# BETTER_AUTH_SECRET   -> openssl rand -base64 32
# BETTER_AUTH_URL      -> https://your-worker.workers.dev
# GOOGLE_CLIENT_SECRET

[vars]
# Public Google OAuth client ID (safe to expose)
GOOGLE_CLIENT_ID = "871603704767-ur63q3uph9i7m53vmafi6l4gbbculj07.apps.googleusercontent.com"
